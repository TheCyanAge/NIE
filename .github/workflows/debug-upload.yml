name: debug-upload
on: workflow_dispatch
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npx playwright-core install chromium
      - run: CHROMIUM_PATH="$(node -e "console.log(require('playwright-core').chromium.executablePath())")" node scripts/debug-upload.mjs
