name: understanding-eval

# Measures how well NIE's language model understands what a writer is asking, with the REAL model (Qwen2.5-3B) and the app's own
# llama-server arguments, on the labelled messages in tests/fixtures/understanding-messages.json. It also runs a short real
# conversation through the whole orchestrator (--e2e). Nothing here builds, ships or publishes anything: it only reports numbers
# (job log + the understanding-report artifact), so the prompt can be tuned against evidence instead of guesses.
on:
  workflow_dispatch:
    inputs:
      sample:
        description: 'Messages per run, spread evenly over every task (0 = all 260; about 5 seconds each on a CI machine)'
        type: string
        default: '100'
      slots:
        description: 'Model-server slots: 2 is what the app uses; 1 shows what a single slot costs (the reading and the answer evict each other from its prompt cache)'
        type: string
        default: '2'
      long_text:
        description: 'Instead of the labelled messages: long-text reading on the real model (facts planted in 8,000 to 148,000 word texts, asked the old way and the new way)'
        type: boolean
        default: false
      ab_slots:
        description: 'Instead of the labelled messages: the same conversation with 1 slot and with 2, twice each, alternating, on this machine (about 12 minutes)'
        type: boolean
        default: false
      e2e:
        description: 'Also run a short real conversation through the whole orchestrator (slower: it generates answers)'
        type: boolean
        default: true

jobs:
  eval:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Fetch the llama.cpp runtime (Linux)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # The Linux release file is named differently from release to release (.zip or .tar.gz), so ask the release what it has.
          gh release view b9085 --repo ggml-org/llama.cpp --json assets --jq '.assets[].name' | grep -i 'ubuntu-x64' || true
          mkdir -p rt apps/desktop/bin
          gh release download b9085 --repo ggml-org/llama.cpp --pattern 'llama-*-bin-ubuntu-x64*' --dir rt
          ls -la rt
          for f in rt/*; do
            case "$f" in
              *.zip) unzip -q -o "$f" -d rt/x ;;
              *.tar.gz|*.tgz) mkdir -p rt/x && tar -xzf "$f" -C rt/x ;;
            esac
          done
          # llama-server and every library it loads, flattened next to each other (like the app's own runtime folder)
          find rt/x \( -type f -o -type l \) \( -name 'llama-server' -o -name '*.so' -o -name '*.so.*' \) -exec cp -P {} apps/desktop/bin/ \;
          chmod +x apps/desktop/bin/llama-server
          ls -la apps/desktop/bin

      - name: Fetch the real model (about 1.9 GB, resumable)
        run: node scripts/fetch-runtime.mjs --no-runtime

      - name: Measure understanding with the real model
        env:
          LD_LIBRARY_PATH: ${{ github.workspace }}/apps/desktop/bin
        run: |
          SAMPLE="${{ inputs.sample }}"
          E2E=""
          if [ "${{ inputs.e2e }}" = "true" ]; then E2E="--e2e"; fi
          if [ "${{ inputs.long_text }}" = "true" ]; then
            node scripts/understanding-probe.mjs --long --out understanding-report.json
          elif [ "${{ inputs.ab_slots }}" = "true" ]; then
            node scripts/understanding-probe.mjs --ab-slots --out understanding-report.json
          else
            node scripts/understanding-probe.mjs --sample "${SAMPLE:-100}" --slots "${{ inputs.slots }}" $E2E --out understanding-report.json
          fi

      - name: Upload the report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: understanding-report
          path: understanding-report.json
          if-no-files-found: ignore
